<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div id="red" class="red-off"></div>
            <div id="yellow" class="yellow-off"></div>
            <div id="green" class="green-off"></div>
        </div>
    </div>
    <script>
        const red = document.querySelector("#red");
        const yellow = document.querySelector("#yellow");
        const green = document.querySelector("#green");

        function updateRed(){
            green.classList.remove("green");
            green.classList.add("green-off");
            red.classList.add("red");
            red.classList.remove("red-off");
            setTimeout(()=>{
                updateYellow();
            },3000);
        }

        function updateYellow(){
            red.classList.remove("red");
            red.classList.add("red-off");
            yellow.classList.add("yellow");
            yellow.classList.remove("yellow-off");
            setTimeout(()=>{
                updateGreen();
            },2000);
        }

        function updateGreen(){
            yellow.classList.remove("yellow");
            yellow.classList.add("yellow-off");
            green.classList.add("green");
            green.classList.remove("green-off");
            setTimeout(()=>{
                updateRed();
            },3000);
        }

        updateRed();

    </script>
</body>
</html>
